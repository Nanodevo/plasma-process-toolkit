[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plasmafab"
version = "0.1.0"
description = "Virtual plasma fab: PECVD/RIE tool models with DOE, SPC and a monitoring dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Emre Acar" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "plotly>=5.18",
    "streamlit>=1.30",
]

[tool.setuptools]
packages = ["plasmafab"]
