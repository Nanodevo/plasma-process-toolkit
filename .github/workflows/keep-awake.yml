# Keeps the hosted dashboard (plasmafab.streamlit.app) from going to sleep.
#
# Lesson learned 2026-08-13: a curl ping is a placebo. Streamlit's edge
# returns HTTP 200 even for the "app has gone to sleep" page, and a bare
# GET never opens the WebSocket session that Community Cloud counts as
# viewer traffic - so the old ping was green every hour while the app
# slept anyway. This version drives a real headless browser: it loads
# the page, clicks the wake-up button if the sleep page is showing, and
# holds the session open long enough to register as a visit.
#
# Note: GitHub disables cron workflows in repos with no activity for 60
# days - a commit or a manual run re-enables it.
name: Keep dashboard awake

on:
  schedule:
    - cron: "17 */3 * * *"      # every 3 hours at :17 (sleep threshold is ~12h)
  workflow_dispatch:

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium
      - name: Open a real session (and wake the app if needed)
        run: |
          python - <<'EOF'
          from playwright.sync_api import sync_playwright

          URL = "https://plasmafab.streamlit.app/"

          def all_text(page) -> str:
              # Community Cloud renders the app inside an iframe; the main
              # frame's body is empty. Collect text from every frame.
              parts = []
              for f in page.frames:
                  try:
                      parts.append(f.inner_text("body", timeout=5_000))
                  except Exception:
                      pass
              return " ".join(parts).lower()

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(URL, wait_until="load", timeout=120_000)
              page.wait_for_timeout(10_000)
              body = all_text(page)
              if "gone to sleep" in body or "back up" in body:
                  print("app was ASLEEP - clicking the wake button")
                  for f in page.frames:
                      try:
                          btn = f.get_by_role("button").filter(
                              has_text="back up").first
                          btn.click(timeout=5_000)
                          break
                      except Exception:
                          continue
                  page.wait_for_timeout(60_000)
              else:
                  # Hold the WebSocket open so the visit counts.
                  page.wait_for_timeout(25_000)
              body = all_text(page)
              ok = ("plasmafab" in body) and ("gone to sleep" not in body)
              print("final state:", "AWAKE" if ok else "STILL ASLEEP")
              browser.close()
              raise SystemExit(0 if ok else 1)
          EOF
